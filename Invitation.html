<style>
:root{--bg1:#e8d6ff;--bg2:#ffd9ec;--card:#fffafe;--ink:#5b2a86;--soft:#9b6fc4;--rose:#ff8fc2;--gold:#d9a441;--line:#dcc6f2;--sh:#ffc2e0;--gl:rgba(255,194,224,0);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1648;--bg2:#3b1840;--card:#321c52;--ink:#f1e2ff;--soft:#cfaff0;--line:#5b3a85;--sh:#a0449f;--gl:rgba(255,143,194,.4)}}
:root[data-theme="dark"]{--bg1:#2a1648;--bg2:#3b1840;--card:#321c52;--ink:#f1e2ff;--soft:#cfaff0;--line:#5b3a85;--sh:#a0449f;--gl:rgba(255,143,194,.4)}
*{box-sizing:border-box}
html{height:100%}
body{min-height:100%;margin:0}
body{background:linear-gradient(170deg,var(--bg1),var(--bg2) 60%,#bfe3ff);color:var(--ink);font-family:Quicksand,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 0;overflow-x:hidden;position:relative}
.wist{position:fixed;top:0;width:90px;pointer-events:none;opacity:.8}
.wist i{position:absolute;border-radius:50% 50% 60% 60%;filter:blur(.4px)}
.stage{width:min(92vw,410px);position:relative;z-index:2}
.script{font-family:'Great Vibes',cursive;font-weight:400}
.note{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:21px;color:var(--soft);margin:0 0 2px}
/* envelope cover */
.cover{text-align:center;cursor:pointer;padding:10px 0}
.cover:focus-visible,.btn:focus-visible,.music:focus-visible{outline:3px solid var(--rose);outline-offset:6px}
.inv{font-size:46px;line-height:1.3;margin:0 0 18px;color:#fff;text-shadow:0 2px 10px #a15fe0,0 0 18px #ff8fc2}
.env{width:300px;max-width:84vw;height:200px;position:relative;margin:0 auto;perspective:900px;filter:drop-shadow(0 16px 20px rgba(90,40,140,.35))}
.env>*{position:absolute}
.eb{inset:0;background:#7d49b6;border-radius:6px;z-index:1}
.letter{left:12px;right:12px;top:12px;height:170px;background:#fffafe;border-radius:6px;z-index:2;transition:transform .9s ease .5s}
.sl,.sr,.sb{inset:0;z-index:3}
.sl{background:#8a58c2;clip-path:polygon(0 0,52% 56%,0 100%)}
.sr{background:#8a58c2;clip-path:polygon(100% 0,48% 56%,100% 100%)}
.sb{background:#9d6fd6;clip-path:polygon(0 100%,50% 44%,100% 100%);border-radius:0 0 6px 6px}
.flap{left:0;right:0;top:0;height:60%;background:linear-gradient(#b284e6,#a173d8);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease,opacity .3s ease .6s;z-index:4}
.seal{left:50%;top:60%;width:86px;height:104px;margin:-52px 0 0 -43px;z-index:5;transition:opacity .3s}
.cover.opening .flap{transform:rotateX(180deg);opacity:0}
.cover.opening .seal{opacity:0}
.cover.opening .letter{transform:translateY(-60px)}
.who{font-size:36px;margin:22px 0 0;color:var(--ink)}
.click{right:14px;bottom:9px;z-index:6;font:400 20px 'Great Vibes',cursive;color:#fff;text-shadow:0 1px 6px #5b2a86;animation:pulse 2s infinite;transition:opacity .3s}
.cover.opening .click{opacity:0}
@keyframes pulse{50%{transform:scale(1.07)}}
.hidden{display:none}
/* invitation */
.card{background:var(--card);border-radius:30px;padding:30px 22px 26px;text-align:center;box-shadow:0 18px 40px rgba(120,60,170,.25);position:relative}
.invite.show{animation:pop .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(26px)}}
.mane{width:120px;display:block;margin:0 auto 10px}
.invite{border:2px solid transparent;background:radial-gradient(circle at 12% 0,rgba(255,158,196,.28),transparent 48%) padding-box,radial-gradient(circle at 92% 100%,rgba(165,216,255,.35),transparent 50%) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#ff9ec4,#ffd59a,#b8ecd0,#a5d8ff,#c9a4ff) border-box}
.count b{background:linear-gradient(180deg,var(--ink),#d070c0);-webkit-background-clip:text;background-clip:text;color:transparent}
.name{font-size:80px;line-height:1.25;margin:0;padding-top:0;color:var(--ink);text-shadow:1px 2px 0 var(--sh),0 0 16px var(--gl)}
.badge{display:inline-flex;align-items:center;gap:10px;margin:2px 0 18px}
.badge b{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:24px;color:#5b2a86;background:radial-gradient(circle at 30% 30%,#fff3b8,#e6b85c);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--gold)}
.badge span{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:30px}
.rows{display:grid;gap:20px;margin-bottom:0}
.pair{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:start;column-gap:36px}
.pill,.where{padding:2px 8px}

.pill small,.where small{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:16px;color:var(--soft)}
.pill strong{font-size:21px;white-space:nowrap}.where strong{font-size:22px}
.count{display:flex;justify-content:center;gap:16px;margin:30px 0 28px}
.count div{position:relative;min-width:52px;color:var(--ink);padding:0 2px}

.count b{display:block;font:700 34px/1.1 Quicksand,sans-serif}.count span{font:italic 600 16px 'Cormorant Garamond',serif;color:var(--soft)}
.msg{margin:14px 6px 18px;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:20px;color:var(--soft)}
.btn{background:linear-gradient(90deg,var(--rose),#c9a4ff);color:#fff;border:0;border-radius:999px;padding:13px 28px;font:700 16px Quicksand,sans-serif;cursor:pointer;box-shadow:0 6px 14px rgba(180,90,200,.3)}
.btn:active{transform:translateY(2px)}
.music{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;width:48px;height:48px;border-radius:50%;border:0;background:var(--card);box-shadow:0 4px 12px rgba(120,60,170,.3);font-size:22px;cursor:pointer;z-index:5;display:none}
.music.on{display:block}.music.off{opacity:.55}
.fifteen{font:700 30px/1.2 'Cormorant Garamond',serif;text-transform:uppercase;letter-spacing:.14em;text-indent:.14em;margin:-12px 0 28px;background:linear-gradient(180deg,#ffe680,#ffc400 55%,#f09a00);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:lining-nums;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.ap{margin:0 -.09em}
.ball{position:fixed;width:44px;height:56px;border-radius:50% 50% 48% 48%/58% 58% 42% 42%;pointer-events:none;z-index:1;animation:bob 5s ease-in-out infinite;box-shadow:inset -6px -8px 0 rgba(0,0,0,.08),inset 8px 8px 0 rgba(255,255,255,.4)}
.ball:after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:60px;background:rgba(120,70,170,.5)}
.uni{position:fixed;z-index:1;pointer-events:none;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(90,40,140,.3))}
@keyframes bob{50%{transform:translateY(-16px) rotate(4deg)}}
.swipe{margin:22px 0 0;font:italic 600 19px 'Cormorant Garamond',serif;color:var(--soft);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(6px)}}
.gallery{margin-top:40px;text-align:center}
.gal-title{font-size:50px;line-height:1.4;margin:0;color:var(--ink);letter-spacing:1px;word-spacing:6px;text-shadow:1px 2px 0 var(--sh),0 0 16px var(--gl)}
.rb{height:8px;width:150px;margin:6px auto 30px;border-radius:99px;background:linear-gradient(90deg,#ff9ec4,#ffd59a,#f7e07a,#b8ecd0,#a5d8ff,#c9a4ff)}
.polaroid{position:relative;background:#fff;padding:12px 12px 42px;border-radius:6px;box-shadow:0 12px 26px rgba(90,40,140,.28);width:84%;margin:0 auto 44px}
.polaroid img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:3px}
.polaroid:before{content:"";position:absolute;top:-12px;left:50%;width:86px;height:24px;margin-left:-43px;background:rgba(255,158,196,.78);transform:rotate(-4deg)}
.polaroid:after{position:absolute;bottom:8px;right:16px;font-size:22px}
.polaroid:nth-of-type(odd){transform:rotate(-3deg)}
.polaroid:nth-of-type(even){transform:rotate(3deg)}
.polaroid:nth-of-type(2):before{background:rgba(201,164,255,.8)}
.polaroid:nth-of-type(3):before{background:rgba(165,216,255,.8)}
.polaroid:nth-of-type(4):before{background:rgba(184,236,208,.85)}
.polaroid:nth-of-type(1):after{content:"💜"}
.polaroid:nth-of-type(2):after{content:"✨"}
.polaroid:nth-of-type(3):after{content:"🌸"}
.polaroid:nth-of-type(4):after{content:"🎀"}
.see{font-size:38px;line-height:1.3;margin:0 0 26px;color:var(--ink);text-shadow:1px 2px 0 var(--sh),0 0 16px var(--gl)}
.spark{position:fixed;pointer-events:none;font-size:22px;animation:fall 2.8s linear forwards;z-index:6}
@keyframes fall{to{transform:translateY(110vh) rotate(300deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>

<script>
(function(){
  var cover=document.getElementById('cover'),inv=document.getElementById('invite'),mbtn=document.getElementById('music');
  var ac=null,master=null,playing=false,timer=null,beat=.64;
  function ctx(){
    if(ac)return ac;
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
    ac=new AC();
    master=ac.createGain();master.gain.value=.55;
    var lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2800;
    var dl=ac.createDelay();dl.delayTime.value=.3;
    var fb=ac.createGain();fb.gain.value=.32;
    var wet=ac.createGain();wet.gain.value=.3;
    master.connect(lp);lp.connect(ac.destination);
    lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(ac.destination);
    return ac;
  }
  function piano(f,t,d,v){
    var P=[[1,1],[2,.35],[3,.12],[4,.04]];
    P.forEach(function(p){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=f*p[0];
      var a=v*p[1],ring=Math.max(d*2.2,1.1)/p[0]*(p[0]>1?1.2:1);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t+ring);
      o.connect(g);g.connect(master);o.start(t);o.stop(t+ring+.05);
    });
  }
  var M=[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2],[392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,1],[698,.75],[698,.25],[659,1],[523,1],[587,1],[523,2]];
  var C={c:[130.8,196,261.6],g:[98,146.8,246.9],f:[87.3,130.8,220]};
  var B=['c','g','g','c','c','f','f','g'];
  function song(){
    if(!ac||!playing)return;
    var t0=ac.currentTime+.1,t=t0;
    M.forEach(function(n){var d=n[1]*beat;piano(n[0]/1,t,d,.2);t+=d});
    B.forEach(function(k,i){for(var j=0;j<3;j++)piano(C[k][j],t0+(i*3+j)*beat,beat,.1)});
    timer=setTimeout(song,(t-ac.currentTime)*1000+2500);
  }
  function chime(){
    var a=ctx();if(!a)return;
    if(a.state==='suspended')a.resume();
    var t=a.currentTime;
    [[880,0],[1320,.09],[1760,.18]].forEach(function(n){
      var o=a.createOscillator(),g=a.createGain();
      o.type='sine';o.frequency.value=n[0];
      g.gain.setValueAtTime(0,t+n[1]);g.gain.linearRampToValueAtTime(.12,t+n[1]+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+n[1]+.5);
      o.connect(g);g.connect(a.destination);o.start(t+n[1]);o.stop(t+n[1]+.55);
    });
  }
  function rustle(){
    var a=ctx();if(!a)return;
    if(a.state==='suspended')a.resume();
    var t=a.currentTime,len=Math.floor(a.sampleRate*.7),buf=a.createBuffer(1,len,a.sampleRate),dt=buf.getChannelData(0);
    for(var i=0;i<len;i++){var env=(Math.sin(i/len*Math.PI*6)*.5+.5)*(1-i/len);dt[i]=(Math.random()*2-1)*env}
    var s=a.createBufferSource();s.buffer=buf;
    var bp=a.createBiquadFilter();bp.type='bandpass';bp.Q.value=.8;
    bp.frequency.setValueAtTime(1800,t);bp.frequency.exponentialRampToValueAtTime(5000,t+.6);
    var g=a.createGain();g.gain.value=.35;
    s.connect(bp);bp.connect(g);g.connect(a.destination);s.start(t);
    var o=a.createOscillator(),og=a.createGain();
    o.frequency.setValueAtTime(180,t+.05);o.frequency.exponentialRampToValueAtTime(60,t+.25);
    og.gain.setValueAtTime(.25,t+.05);og.gain.exponentialRampToValueAtTime(.0001,t+.3);
    o.connect(og);og.connect(a.destination);o.start(t+.05);o.stop(t+.35);
  }
  var opened=false;
  function open(){
    if(opened)return;opened=true;
    rustle();setTimeout(chime,550);
    playing=true;song();mbtn.classList.add('on');
    cover.classList.add('opening');setTimeout(function(){cover.classList.add('hidden');inv.classList.remove('hidden');inv.classList.add('show');document.getElementById('gal').classList.remove('hidden')},1600);
    var e=['✨','💜','🌸','🎈','⭐','🎀'];
    for(var i=0;i<26;i++){(function(i){setTimeout(function(){
      var s=document.createElement('span');s.className='spark';s.textContent=e[i%e.length];
      s.style.left=Math.random()*95+'vw';s.style.top='-30px';document.body.appendChild(s);
      setTimeout(function(){s.remove()},2900);
    },i*90)})(i)}
  }
  cover.addEventListener('click',open);
  cover.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();open()}});
  mbtn.addEventListener('click',function(){
    if(!ac)return;
    if(playing){playing=false;clearTimeout(timer);ac.suspend();mbtn.classList.add('off')}
    else{playing=true;ac.resume().then(song);mbtn.classList.remove('off')}
  });
  var target=new Date(2026,11,2,19,30,0);
  function tick(){
    var ms=Math.max(0,target-new Date());
    document.getElementById('d').textContent=Math.floor(ms/864e5);
    document.getElementById('h').textContent=Math.floor(ms%864e5/36e5);
    document.getElementById('m').textContent=Math.floor(ms%36e5/6e4);
    document.getElementById('s').textContent=Math.floor(ms%6e4/1e3);
  }
  tick();setInterval(tick,1000);
  document.getElementById('cal').addEventListener('click',function(){
    chime();
    window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Eliza’s 15th Birthday')+'&dates=20261202T193000/20261202T220000&location='+encodeURIComponent('McDonald’s Savano Park'),'_blank');
  });
})();
</script>
